name: Terraform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/hub-account

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configure AWS Credentials (OIDC)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::647132523867:role/github-actions-terraform-role-v1
          aws-region: ap-south-1

      # Verify AWS Login
      - name: Verify AWS Login
        run: aws sts get-caller-identity

      # Create shared credentials profile 'hub' for Terraform provider
      - name: Write AWS shared credentials profile (hub)
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials <<EOF
[hub]
aws_access_key_id = $AWS_ACCESS_KEY_ID
aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
aws_session_token = $AWS_SESSION_TOKEN
region = ap-south-1
EOF

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # Check Terraform Version
      - name: Terraform Version
        run: terraform version

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init

      - name: List files
        run: ls -al
      

      # Validate Terraform
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan
 
      # - name: Terraform Apply
      #   run: terraform apply -auto-approve tfplan

      # Create Execution Plan
      - name: Terraform apply
        run: terraform apply
