name: Terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation to run (plan|apply|destroy)'
        required: true
        default: 'plan'
      env:
        description: 'Environment directory (hub-account or spoke-account)'
        required: true
        default: 'hub-account'
      profile:
        description: 'AWS CLI profile name to write into credentials'
        required: true
        default: 'hub'
      auto_approve:
        description: 'Auto approve for destroy (true/false)'
        required: false
        default: 'true'

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  hub-account:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/hub-account

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configure AWS Credentials (OIDC)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::647132523867:role/github-actions-terraform-role-v1
          aws-region: ap-south-1

      # Verify AWS Login
      - name: Verify AWS Login
        run: aws sts get-caller-identity

      # Create shared credentials profile 'hub' for Terraform provider
      - name: Write AWS shared credentials profile (hub)
        run: |
          mkdir -p ~/.aws
          printf "[hub]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\nregion = ap-south-1\n" \"$AWS_ACCESS_KEY_ID\" \"$AWS_SECRET_ACCESS_KEY\" \"$AWS_SESSION_TOKEN\" > ~/.aws/credentials

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # Check Terraform Version
      - name: Terraform Version
        run: terraform version

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init

      - name: List files
        run: ls -al
      

      # Validate Terraform
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

     
  spoke-account:
    needs: hub-account
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/spoke-account
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Configure AWS Credentials (Spoke - 434097521299)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434097521299:role/github-actions-terraform-role-v1
          aws-region: ap-south-1
 
      - name: Verify AWS Login
        run: aws sts get-caller-identity

      - name: Write AWS shared credentials profile (spoke)
        run: |
          mkdir -p ~/.aws
          printf "[spoke]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\nregion = ap-south-1\n" \"$AWS_ACCESS_KEY_ID\" \"$AWS_SECRET_ACCESS_KEY\" \"$AWS_SESSION_TOKEN\" > ~/.aws/credentials

 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
 
      - name: Terraform Init
        run: terraform init
 
      - name: Terraform Validate
        run: terraform validate
 
      - name: Terraform Plan
        run: terraform plan -out=tfplan
 
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
      

  